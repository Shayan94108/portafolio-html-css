    <text x="432" y="484" font-size="10">He leído la política de privacidad.</text>
    <rect x="408" y="504" width="156" height="38" rx="2" fill="#132F3A"/>
    <text x="443" y="528" font-size="12" fill="#FFFFFF">Enviar consulta</text>
